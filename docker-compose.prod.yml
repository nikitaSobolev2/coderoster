# Compose merge file: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up`.
# Adds resource limits and trims exposed ports for DB/Redis; extend further per environment (secrets, TLS, Rabbit users).

services:
  db:
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  rabbitmq:
    ports:
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  app:
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  worker-code-exec:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
