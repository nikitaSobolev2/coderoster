services:
  db:
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  rabbitmq:
    ports:
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  app:
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  worker-code-exec:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
