# Single-VM production stack (Ubuntu / bare metal).
# No bind mounts: runs the built image from infra/docker/app.Dockerfile (target prod).
#
# Usage:
#   docker compose --env-file .env.prod -f docker-compose.vm-prod.yml build --no-cache app && \
#     docker compose --env-file .env.prod -f docker-compose.vm-prod.yml up -d
#
# Important: NEXT_PUBLIC_* (especially NEXT_PUBLIC_WORKOS_REDIRECT_URI) is baked at `next build`
# inside the image. Changing .env.prod at runtime does not fix localhost redirects — rebuild app.
#
# Optional resource overlay:
#   docker compose -f docker-compose.vm-prod.yml -f docker-compose.prod.yml up -d
#   (docker-compose.prod.yml mainly adds deploy.limits; it also exposes RabbitMQ 15672 — drop that file on locked-down hosts or fork the overlay.)

name: coderoster

x-app-build: &app_build
  context: .
  dockerfile: infra/docker/app.Dockerfile
  target: prod
  args:
    NEXT_PUBLIC_WORKOS_REDIRECT_URI: ${NEXT_PUBLIC_WORKOS_REDIRECT_URI:-https://codium.space/callback}
    NEXT_PUBLIC_USE_FAKE_DATA: ${NEXT_PUBLIC_USE_FAKE_DATA:-${USE_FAKE_DATA:-false}}
    NEXT_PUBLIC_SELF_SERVE_PLANS: ${NEXT_PUBLIC_SELF_SERVE_PLANS:-true}

x-app-env: &app_env
  SKIP_ENV_VALIDATION: ""
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-coderoster}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
  WORKOS_API_KEY: ${WORKOS_API_KEY}
  WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID}
  WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD}
  WORKOS_COOKIE_MAX_AGE: ${WORKOS_COOKIE_MAX_AGE:-2592000}
  NEXT_PUBLIC_WORKOS_REDIRECT_URI: ${NEXT_PUBLIC_WORKOS_REDIRECT_URI}
  USE_FAKE_DATA: ${USE_FAKE_DATA:-false}
  NEXT_PUBLIC_USE_FAKE_DATA: ${NEXT_PUBLIC_USE_FAKE_DATA:-${USE_FAKE_DATA:-false}}
  SANITIZE_MARKDOWN: ${SANITIZE_MARKDOWN:-true}
  ACTIVITY_SNAPSHOT_CRON: ${ACTIVITY_SNAPSHOT_CRON:-30 0 * * *}
  EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-5000}
  EXECUTION_MEMORY_MB: ${EXECUTION_MEMORY_MB:-128}
  EXECUTION_CPUS: ${EXECUTION_CPUS:-0.5}
  EXECUTION_PIDS_LIMIT: ${EXECUTION_PIDS_LIMIT:-64}
  WORKER_PYTHON_IMAGE: ${WORKER_PYTHON_IMAGE:-python:3.12-slim}
  WORKER_PHP_IMAGE: ${WORKER_PHP_IMAGE:-php:8.3-cli-alpine}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-coderoster-uploads}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  SELF_SERVE_PLANS: ${SELF_SERVE_PLANS:-true}
  NEXT_PUBLIC_SELF_SERVE_PLANS: ${NEXT_PUBLIC_SELF_SERVE_PLANS:-true}
  AI_CODE_IMPROVE_API_KEY: ${AI_CODE_IMPROVE_API_KEY:-}
  AI_CODE_IMPROVE_BASE_URL: ${AI_CODE_IMPROVE_BASE_URL:-}
  AI_CODE_IMPROVE_CB_THRESHOLD: ${AI_CODE_IMPROVE_CB_THRESHOLD:-5}
  AI_CODE_IMPROVE_CB_OPEN_SEC: ${AI_CODE_IMPROVE_CB_OPEN_SEC:-120}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coderoster}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coderoster}
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ coderoster ]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--save", "60", "1", "--loglevel", "warning" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ coderoster ]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ coderoster ]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
      - ./infra/compose/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ coderoster ]

  app:
    build: *app_build
    restart: unless-stopped
    environment:
      <<: *app_env
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [ coderoster ]

  outbox:
    build: *app_build
    restart: unless-stopped
    command:
      [
        "node",
        "--conditions=react-server",
        "node_modules/tsx/dist/cli.mjs",
        "src/server/outbox/dispatcher.ts",
      ]
    environment:
      <<: *app_env
      SKIP_MIGRATIONS: "true"
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ coderoster ]

  result-consumer:
    build: *app_build
    restart: unless-stopped
    command:
      [
        "node",
        "--conditions=react-server",
        "node_modules/tsx/dist/cli.mjs",
        "src/server/consumers/executionResult.ts",
      ]
    environment:
      <<: *app_env
      SKIP_MIGRATIONS: "true"
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ coderoster ]

  code-improve-worker:
    build:
      context: ./workers/code-improve
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-coderoster}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      AI_CODE_IMPROVE_API_KEY: ${AI_CODE_IMPROVE_API_KEY:-}
      AI_CODE_IMPROVE_BASE_URL: ${AI_CODE_IMPROVE_BASE_URL:-}
      AI_CODE_IMPROVE_CB_THRESHOLD: ${AI_CODE_IMPROVE_CB_THRESHOLD:-5}
      AI_CODE_IMPROVE_CB_OPEN_SEC: ${AI_CODE_IMPROVE_CB_OPEN_SEC:-120}
      CODE_IMPROVE_AMQP_PREFETCH: ${CODE_IMPROVE_AMQP_PREFETCH:-2}
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ coderoster ]

  account-deletion-consumer:
    build: *app_build
    restart: unless-stopped
    command:
      [
        "node",
        "--conditions=react-server",
        "node_modules/tsx/dist/cli.mjs",
        "src/server/consumers/accountDeletion.ts",
      ]
    environment:
      <<: *app_env
      SKIP_MIGRATIONS: "true"
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ coderoster ]

  snapshot:
    build: *app_build
    restart: unless-stopped
    command:
      [
        "node",
        "--conditions=react-server",
        "node_modules/tsx/dist/cli.mjs",
        "src/server/jobs/activitySnapshot.ts",
      ]
    environment:
      <<: *app_env
      SKIP_MIGRATIONS: "true"
    depends_on:
      db: { condition: service_healthy }
    networks: [ coderoster ]

  worker-code-exec:
    build:
      context: ./workers/code-executor
      dockerfile: Dockerfile
    user: "0:0"
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      WORKER_PYTHON_IMAGE: ${WORKER_PYTHON_IMAGE:-python:3.12-slim}
      WORKER_PHP_IMAGE: ${WORKER_PHP_IMAGE:-php:8.3-cli-alpine}
      IMAGE_PULL_TIMEOUT_MS: ${IMAGE_PULL_TIMEOUT_MS:-900000}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-5000}
      EXECUTION_MEMORY_MB: ${EXECUTION_MEMORY_MB:-128}
      EXECUTION_CPUS: ${EXECUTION_CPUS:-0.5}
      EXECUTION_PIDS_LIMIT: ${EXECUTION_PIDS_LIMIT:-64}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [ coderoster ]

volumes:
  db_data:
  redis_data:
  rabbit_data:
  minio_data:

networks:
  coderoster:
    name: coderoster
